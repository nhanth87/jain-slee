# Quarkus hosts CDI only — all HTTP is ra-http-server (no quarkus-rest).
http.ra.port=8080

# micro-jainslee container (adapter-quarkus)
microjainslee.container.buffer-size=4096
microjainslee.container.prefer-virtual-threads=true
quarkus.config.mapping.validate-unknown=false
quarkus.banner.enabled=false

# Infinispan / JGroups fabric — leave false for single-JVM Direct.
# Set true when running two micro-services processes (see scripts/run-ms-*.sh).
jainslee.ms.cluster-enabled=false
jainslee.ms.cluster-stack=tcp
jainslee.ms.cluster-initial-hosts=127.0.0.1[7800]

# HTTP ingress: full gateway on the ingress service node; leaf nodes keep
# ra-http-server for built-in GET /health when health-ra-on-leaf=true.
jainslee.ms.ingress-service=http-ra
jainslee.ms.health-ra-on-leaf=true

# Deployment topology is classpath:deployment.yml by default.
# Override with -Djainslee.deployment.resource=deployment-microservices.yml
# and -Djainslee.node-id=node-ra|node-sbb

# MS / ISPN / demo logs on stdout (run-ms-*.sh). http-sbb invoke logs appear
# in the *node-sbb* process — not in HTTP responses on :8082 (/health only).
quarkus.log.category."com.microjainslee.ms".level=INFO
quarkus.log.category."com.microjainslee.ms.ispn".level=INFO
quarkus.log.category."com.example.ms.quarkus".level=INFO
quarkus.log.category."com.example.ms.quarkus.services".level=INFO
