# Two-node topology: each Quarkus process activates only its assigned services.
# Remote calls use Infinispan distributed queues (ms-ispn).
#
# Terminal A: -Djainslee.node-id=node-signaling -Dquarkus.http.port=8081
# Terminal B: -Djainslee.node-id=node-app       -Dquarkus.http.port=8082
mode: cluster

nodes:
  node-signaling: { host: "127.0.0.1", base-port: 9000 }
  node-app: { host: "127.0.0.1", base-port: 9000 }

services:
  signaling: { node: node-signaling, transport: INFINISPAN_QUEUE, port: 9001 }
  app: { node: node-app, transport: INFINISPAN_QUEUE, port: 9002 }
