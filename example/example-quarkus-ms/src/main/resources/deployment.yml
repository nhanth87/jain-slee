# Single-JVM topology: both services local → SleeServiceClient uses Direct.
mode: single

nodes:
  node-ra:  { host: "127.0.0.1", base-port: 9000 }
  node-sbb: { host: "127.0.0.1", base-port: 9000 }

services:
  http-ra:  { node: node-ra,  transport: INFINISPAN_QUEUE, port: 9001 }
  http-sbb: { node: node-sbb, transport: INFINISPAN_QUEUE, port: 9002 }
