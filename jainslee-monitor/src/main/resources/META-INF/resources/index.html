<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>micro-jainslee Monitor Hub</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ota-theme') || localStorage.getItem('mw-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <!-- Absolute /telemetry/… paths: /telemetry (no slash) must not break relative assets. -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/telemetry/hub.css"/>
  <script src="/telemetry/htmx.min.js"></script>
  <script defer src="/telemetry/hub.js"></script>
</head>
<body class="hub-body">
  <header class="hub-header">
    <div class="hub-header-inner">
      <div class="hub-brand">
        <span class="hub-brand-bar" aria-hidden="true"></span>
        <div>
          <a href="/telemetry/" class="hub-brand-link">micro-jainslee</a>
          <span class="hub-brand-sub">monitor hub</span>
        </div>
      </div>
      <div class="hub-header-meta">
        <span id="hub-clock" class="hub-clock"></span>
        <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme">
          Theme<span class="theme-toggle-label"></span>
        </button>
        <a class="hub-admin-link" href="/admin">OTA Admin</a>
      </div>
    </div>
  </header>

  <main class="hub-main">
    <p class="hub-eyebrow">RA admin packs</p>
    <div class="hub-title-row">
      <h1 class="hub-title">Config · telemetry · apply</h1>
      <span id="hub-ind" class="htmx-indicator hub-loading">loading…</span>
    </div>

    <nav id="hub-tabs"
         class="hub-tabs"
         hx-get="/telemetry/partial/ra-nav"
         hx-trigger="load once"
         hx-swap="innerHTML"
         hx-indicator="#hub-ind"
         aria-label="Monitor tabs">
      <button type="button" class="hub-tab active"
              hx-get="/telemetry/partial/overview"
              hx-target="#hub-panel"
              hx-swap="innerHTML"
              hx-indicator="#hub-ind"
              data-tab="overview">Overview</button>
    </nav>

    <!-- Panel content is selected once after ra-nav settles (hub.js). No hx-trigger=load here —
         that raced with afterSettle auto-click and left the indicator looking stuck. -->
    <div id="hub-panel" class="hub-panel-host">
      <p class="hub-muted">Loading hub…</p>
    </div>
  </main>
</body>
</html>
