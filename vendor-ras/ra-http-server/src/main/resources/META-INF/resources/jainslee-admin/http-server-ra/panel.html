<div class="admin-panel">
  <p class="text-xs uppercase tracking-[0.25em] text-signal">Config</p>
  <h2 class="mt-1 text-xl font-semibold text-slate-50">HTTP Server · http-server-ra</h2>
  <p class="mt-2 text-sm text-ink-mute">
    Tab <strong>green</strong> when <code class="font-mono text-slate-300">listening</code>
    (server accepts requests). Intentional server-RA exception — not peer UP
    (HTTP has no peer plane). See ADR 0003.
  </p>
  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    <label class="block text-xs uppercase tracking-wide text-ink-mute">Host
      <input id="http-host" class="hub-input mt-1" value="127.0.0.1"/>
    </label>
    <label class="block text-xs uppercase tracking-wide text-ink-mute">Port
      <input id="http-port" class="hub-input mt-1" value="8080"/>
    </label>
  </div>
  <div class="ra-toolbar">
    <button class="btn-hub btn-hub-primary" type="button" id="http-save">Save Config</button>
    <button class="btn-hub" type="button" id="http-rebind">Rebind</button>
    <button class="btn-hub" type="button" id="http-refresh"
            hx-get="/api/ra/http-server-ra/status.html"
            hx-target="#http-status"
            hx-swap="innerHTML"
            hx-on::after-request="if(window.htmx){htmx.trigger('#http-endpoints','load')}">Refresh</button>
  </div>
  <div class="ra-status" id="http-status"
       hx-get="/api/ra/http-server-ra/status.html"
       hx-trigger="load, every 4s"
       hx-swap="innerHTML">Loading…</div>
  <h3 class="mt-6 text-xs uppercase tracking-[0.2em] text-ink-mute">Known endpoints</h3>
  <p class="mt-1 text-sm text-ink-mute">
    Routes from <code class="font-mono text-slate-300">http-server-ra</code>,
    <code class="font-mono text-slate-300">micro-jainslee</code> hub, and the app catalog.
  </p>
  <div id="http-endpoints"
       class="mt-3"
       hx-get="/api/ra/http-server-ra/endpoints.html"
       hx-trigger="load, every 8s"
       hx-swap="innerHTML">Loading endpoints…</div>
  <div class="ra-msg" id="http-msg"></div>
</div>
